<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc"><title id="title">WOM: from your image to an explorable 3D world</title><desc id="desc">Choose a photograph, reconstruct objects and surroundings, explore the scene, and inspect WOMetrics evidence.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#e8b26a"/></marker></defs><rect width="1280" height="510" rx="24" fill="#12100e"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="49" font-size="17" fill="#e8b26a" letter-spacing="2">WOM / PHOTO → WORLD → EVIDENCE</text><text x="48" y="106" font-size="45" fill="#f4ede2" font-family="Georgia, serif">One image. A world you can inspect.</text><rect x="48" y="149" width="278" height="194" rx="18" fill="#211d18" stroke="#65513a"/><text x="68" y="185" font-size="16" fill="#e8b26a" >01 / YOUR PHOTO</text><text x="68" y="230" font-size="19" fill="#f4ede2" >Start with a moment.</text><text x="68" y="276" font-size="15" fill="#c7bcae" >JPG, PNG, WebP or HEIC</text><text x="68" y="302" font-size="15" fill="#c7bcae" >in the hosted application.</text><path d="M328 246H348" stroke="#e8b26a" stroke-width="2" marker-end="url(#arrow)"/><rect x="350" y="149" width="278" height="194" rx="18" fill="#211d18" stroke="#65513a"/><text x="370" y="185" font-size="16" fill="#e8b26a" >02 / RECONSTRUCT</text><text x="370" y="230" font-size="19" fill="#f4ede2" >Build objects + surroundings.</text><text x="370" y="276" font-size="15" fill="#c7bcae" >Muse plans · SAM segments</text><text x="370" y="302" font-size="15" fill="#c7bcae" >MoGe depth · IDOL / Tripo · Marble</text><path d="M630 246H650" stroke="#e8b26a" stroke-width="2" marker-end="url(#arrow)"/><rect x="652" y="149" width="278" height="194" rx="18" fill="#211d18" stroke="#65513a"/><text x="672" y="185" font-size="16" fill="#e8b26a" >03 / EXPLORE</text><text x="672" y="230" font-size="19" fill="#f4ede2" >Step beyond the frame.</text><text x="672" y="276" font-size="15" fill="#c7bcae" >View the composed scene.</text><text x="672" y="302" font-size="15" fill="#c7bcae" >Walk, orbit and save new views.</text><path d="M932 246H952" stroke="#e8b26a" stroke-width="2" marker-end="url(#arrow)"/><rect x="954" y="149" width="278" height="194" rx="18" fill="#211d18" stroke="#65513a"/><text x="974" y="185" font-size="16" fill="#e8b26a" >04 / MEASURE</text><text x="974" y="230" font-size="19" fill="#f4ede2" >Keep the evidence.</text><text x="974" y="276" font-size="15" fill="#c7bcae" >Fidelity · placement · asset quality</text><text x="974" y="302" font-size="15" fill="#c7bcae" >Camera · failures · cost · time</text><text x="48" y="390" font-size="22" fill="#e8b26a" >World of a Memory</text><text x="48" y="423" font-size="18" fill="#c7bcae" >The photo-to-3D application</text><text x="458" y="390" font-size="22" fill="#e8b26a" >WOMPar</text><text x="458" y="423" font-size="18" fill="#c7bcae" >The frozen reference system</text><text x="858" y="390" font-size="22" fill="#e8b26a" >WOMetrics</text><text x="858" y="423" font-size="18" fill="#c7bcae" >The evaluation framework</text><text x="48" y="479" font-size="17" fill="#a99d8d" >AI infers unseen surfaces. Explore new views and inspect the saved measurements.</text></g></svg>
