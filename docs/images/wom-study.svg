<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="672" viewBox="0 0 1280 672" role="img" aria-labelledby="title desc"><title id="title">WOM controlled placement study: quality, cost and latency</title><desc id="desc">Four models achieve 75.28 to 75.47 percent photo-weighted silhouette IoU. Read the linked study for protocol, results and limitations.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#e8b26a"/></marker></defs><rect width="1280" height="672" rx="24" fill="#12100e"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="47" font-size="17" fill="#e8b26a" letter-spacing="2">WOMETRICS / CONTROLLED PLACEMENT PILOT</text><text x="48" y="103" font-size="43" fill="#f4ede2" font-family="Georgia, serif">Similar placement. Different resource costs.</text><text x="48" y="143" font-size="20" fill="#c7bcae" >4 photos · 12 object cases · 144 attempts · 422 live API calls · $3.1762 total</text><text x="48" y="210" font-size="15" fill="#e8b26a" >MODEL</text><text x="330" y="210" font-size="15" fill="#e8b26a" >SILHOUETTE IoU / 0–100%</text><text x="715" y="210" font-size="15" fill="#e8b26a" >COST / 36 ATTEMPTS</text><text x="1020" y="210" font-size="15" fill="#e8b26a" >MEDIAN TIME</text><text x="48" y="259" font-size="23" fill="#f4ede2" >Muse Spark 1.3</text><rect x="330" y="239" width="250" height="24" rx="5" fill="#302b24"/><rect x="330" y="239" width="188.20453351040558" height="24" rx="5" fill="#a9c79a"/><text x="600" y="259" font-size="22" fill="#f4ede2" >75.28%</text><text x="715" y="259" font-size="25" fill="#f4ede2" >$0.6997</text><text x="1020" y="259" font-size="25" fill="#f4ede2" >26.09 s</text><text x="48" y="333" font-size="23" fill="#f4ede2" >Muse Wonder 1.0</text><rect x="330" y="313" width="250" height="24" rx="5" fill="#302b24"/><rect x="330" y="313" width="188.2872051125307" height="24" rx="5" fill="#a9c79a"/><text x="600" y="333" font-size="22" fill="#f4ede2" >75.31%</text><text x="715" y="333" font-size="25" fill="#f4ede2" >$2.0814</text><text x="1020" y="333" font-size="25" fill="#f4ede2" >29.36 s</text><text x="48" y="407" font-size="23" fill="#f4ede2" >GPT-6.1 Terra</text><rect x="330" y="387" width="250" height="24" rx="5" fill="#302b24"/><rect x="330" y="387" width="188.6685435034698" height="24" rx="5" fill="#a9c79a"/><text x="600" y="407" font-size="22" fill="#f4ede2" >75.47%</text><text x="715" y="407" font-size="25" fill="#f4ede2" >$0.1618</text><text x="1020" y="407" font-size="25" fill="#f4ede2" >15.70 s</text><text x="48" y="481" font-size="23" fill="#f4ede2" >GPT-6.1 Sol</text><rect x="330" y="461" width="250" height="24" rx="5" fill="#302b24"/><rect x="330" y="461" width="188.63359443177353" height="24" rx="5" fill="#a9c79a"/><text x="600" y="481" font-size="22" fill="#f4ede2" >75.45%</text><text x="715" y="481" font-size="25" fill="#f4ede2" >$0.2333</text><text x="1020" y="481" font-size="25" fill="#f4ede2" >11.62 s</text><path d="M48 526H1232" stroke="#65513a"/><text x="48" y="566" font-size="22" fill="#a9c79a" >Shared auto-fit tool: 75.28% IoU without language-model calls.</text><text x="48" y="606" font-size="18" fill="#c7bcae" >Equal weights per photo. All models completed 36/36 attempts. Holm-adjusted p = 1.0 for both planned pairs.</text><text x="48" y="639" font-size="18" fill="#c7bcae" >Existing assets; four independent photos. Timing excludes world generation. Global WOMPar: Not ranked.</text></g></svg>
